<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="navTitle navDesc">
<title id="navTitle">Navigation LiDAR contre navigation par caméra</title>
<desc id="navDesc">Les deux robots vus de côté. Le LiDAR balaie un plan horizontal à la hauteur de son capteur : un câble posé à plat sur le sol passe sous ce plan et n'est pas détecté. La caméra regarde vers l'avant et vers le bas, reconnaît visuellement le câble et l'évite, mais dépend de la lumière ambiante et produit une carte moins précise.</desc>
<rect width="820" height="430" fill="#FAF8F4"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <text x="60" y="46" font-size="12.5" font-weight="600" fill="#8A5A2B" letter-spacing="1.3">LIDAR — IL MESURE</text>
  <text x="60" y="70" font-size="13.5" fill="#1C1D22">Un plan horizontal, à hauteur du capteur.</text>
  <rect x="60" y="96" width="340" height="236" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="2"/><line x1="78" y1="286" x2="382" y2="286" stroke="#1C1D22" stroke-width="2"/><line x1="82" y1="286" x2="74" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="98" y1="286" x2="90" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="114" y1="286" x2="106" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="130" y1="286" x2="122" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="146" y1="286" x2="138" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="162" y1="286" x2="154" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="178" y1="286" x2="170" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="194" y1="286" x2="186" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="210" y1="286" x2="202" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="226" y1="286" x2="218" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="242" y1="286" x2="234" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="258" y1="286" x2="250" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="274" y1="286" x2="266" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="290" y1="286" x2="282" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="306" y1="286" x2="298" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="322" y1="286" x2="314" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="338" y1="286" x2="330" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="354" y1="286" x2="346" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="370" y1="286" x2="362" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="144" y1="245.5" x2="374" y2="245.5" stroke="#8A5A2B" stroke-width="2" stroke-dasharray="6 4"/><text x="374" y="236.5" font-size="11.5" fill="#8A5A2B" text-anchor="end">plan de balayage</text><rect x="106" y="252" width="76" height="34" rx="7" fill="#1C1D22"/><rect x="132" y="239" width="24" height="13" rx="3" fill="#1C1D22"/><circle cx="144" cy="245.5" r="3.4" fill="#8A5A2B"/><path d="M 278 286 q 16 -8 32 0 q 16 8 32 0" fill="none" stroke="#6B6A63" stroke-width="3.4" stroke-linecap="round"/><g stroke="#6B6A63" stroke-width="2.2" stroke-linecap="round"><line x1="303" y1="252" x2="317" y2="266"/><line x1="317" y1="252" x2="303" y2="266"/></g>
  <text x="60" y="364" font-size="13" fill="#6B6A63">Le câble passe sous le plan : non détecté.</text>

  <text x="420" y="46" font-size="12.5" font-weight="600" fill="#8A5A2B" letter-spacing="1.3">CAMÉRA — ELLE RECONNAÎT</text>
  <text x="420" y="70" font-size="13.5" fill="#1C1D22">Un champ de vision vers l'avant et le bas.</text>
  <rect x="420" y="96" width="340" height="236" fill="#FFFFFF" stroke="#E4E0D6" stroke-width="2"/><line x1="438" y1="286" x2="742" y2="286" stroke="#1C1D22" stroke-width="2"/><line x1="442" y1="286" x2="434" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="458" y1="286" x2="450" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="474" y1="286" x2="466" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="490" y1="286" x2="482" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="506" y1="286" x2="498" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="522" y1="286" x2="514" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="538" y1="286" x2="530" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="554" y1="286" x2="546" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="570" y1="286" x2="562" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="586" y1="286" x2="578" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="602" y1="286" x2="594" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="618" y1="286" x2="610" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="634" y1="286" x2="626" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="650" y1="286" x2="642" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="666" y1="286" x2="658" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="682" y1="286" x2="674" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="698" y1="286" x2="690" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="714" y1="286" x2="706" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><line x1="730" y1="286" x2="722" y2="294" stroke="#E4E0D6" stroke-width="1.5"/><path d="M 531 264 L 730 222 L 730 286 L 557 286 Z" fill="#8A5A2B" opacity="0.12"/><text x="730" y="212" font-size="11.5" fill="#8A5A2B" text-anchor="end">champ de vision</text><rect x="466" y="252" width="76" height="34" rx="7" fill="#1C1D22"/><circle cx="531" cy="264" r="5" fill="#8A5A2B"/><path d="M 638 286 q 16 -8 32 0 q 16 8 32 0" fill="none" stroke="#6B6A63" stroke-width="3.4" stroke-linecap="round"/><rect x="632" y="269" width="74" height="26" rx="3" fill="none" stroke="#8A5A2B" stroke-width="1.5" stroke-dasharray="4 3"/><text x="669" y="262" font-size="11.5" fill="#8A5A2B" text-anchor="middle">« câble »</text>
  <text x="420" y="364" font-size="13" fill="#6B6A63">Le câble est reconnu et contourné.</text>
</g>
</svg>