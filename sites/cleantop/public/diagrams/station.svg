<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-labelledby="stTitle stDesc">
<title id="stTitle">Ce que contient une station de base tout-en-un</title>
<desc id="stDesc">Coupe schématique d'une station de base. Un modèle simple ne contient qu'un sac à poussière pour le vidage automatique. Une station tout-en-un y ajoute un réservoir d'eau propre, le lavage de la serpillière et son séchage à air chaud. Chaque module ajouté est une pièce mobile de plus, donc un point d'usure supplémentaire.</desc>
<rect width="820" height="430" fill="#FAF8F4"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <text x="60" y="48" font-size="12.5" font-weight="600" fill="#8A5A2B" letter-spacing="1.3">CE QUE CONTIENT UNE STATION</text>
  <text x="60" y="74" font-size="13.5" fill="#1C1D22">Le nombre de modules est ce qui sépare une station simple d'une tout-en-un.</text>

  <rect x="96" y="106" width="128" height="216" rx="8" fill="#E4E0D6" stroke="#1C1D22" stroke-width="2"/>
  <rect x="110" y="120" width="100" height="44" rx="3" fill="#FFFFFF" stroke="#6B6A63" stroke-width="1.2"/><circle cx="160.0" cy="142.0" r="12" fill="#8A5A2B"/><text x="160.0" y="146.5" font-size="12" font-weight="600" fill="#FAF8F4" text-anchor="middle">1</text><rect x="110" y="170" width="100" height="44" rx="3" fill="#FFFFFF" stroke="#6B6A63" stroke-width="1.2"/><circle cx="160.0" cy="192.0" r="12" fill="#8A5A2B"/><text x="160.0" y="196.5" font-size="12" font-weight="600" fill="#FAF8F4" text-anchor="middle">2</text><rect x="110" y="220" width="100" height="44" rx="3" fill="#FFFFFF" stroke="#6B6A63" stroke-width="1.2"/><circle cx="160.0" cy="242.0" r="12" fill="#8A5A2B"/><text x="160.0" y="246.5" font-size="12" font-weight="600" fill="#FAF8F4" text-anchor="middle">3</text><rect x="110" y="270" width="100" height="44" rx="3" fill="#FFFFFF" stroke="#6B6A63" stroke-width="1.2"/><circle cx="160.0" cy="292.0" r="12" fill="#8A5A2B"/><text x="160.0" y="296.5" font-size="12" font-weight="600" fill="#FAF8F4" text-anchor="middle">4</text>
  <rect x="90" y="322" width="140" height="14" rx="3" fill="#1C1D22"/>

  <circle cx="280" cy="144" r="10" fill="none" stroke="#8A5A2B" stroke-width="1.6"/><text x="280" y="148" font-size="11" font-weight="600" fill="#8A5A2B" text-anchor="middle">1</text><text x="300" y="144" font-size="13" font-weight="500" fill="#1C1D22">Sac à poussière</text><text x="300" y="163" font-size="12.5" fill="#6B6A63">Sur toutes les stations : le robot se vide seul.</text>
  <circle cx="280" cy="202" r="10" fill="none" stroke="#8A5A2B" stroke-width="1.6"/><text x="280" y="206" font-size="11" font-weight="600" fill="#8A5A2B" text-anchor="middle">2</text><text x="300" y="202" font-size="13" font-weight="500" fill="#1C1D22">Réservoir d'eau propre</text><text x="300" y="221" font-size="12.5" fill="#6B6A63">Dès que le robot lave : la station le remplit.</text>
  <circle cx="280" cy="260" r="10" fill="none" stroke="#8A5A2B" stroke-width="1.6"/><text x="280" y="264" font-size="11" font-weight="600" fill="#8A5A2B" text-anchor="middle">3</text><text x="300" y="260" font-size="13" font-weight="500" fill="#1C1D22">Lavage de la serpillière</text><text x="300" y="279" font-size="12.5" fill="#6B6A63">Stations tout-en-un : rincée après chaque passage.</text>
  <circle cx="280" cy="318" r="10" fill="none" stroke="#8A5A2B" stroke-width="1.6"/><text x="280" y="322" font-size="11" font-weight="600" fill="#8A5A2B" text-anchor="middle">4</text><text x="300" y="318" font-size="13" font-weight="500" fill="#1C1D22">Séchage à air chaud</text><text x="300" y="337" font-size="12.5" fill="#6B6A63">Le plus récent : évite l'odeur d'humidité.</text>

  <text x="60" y="400" font-size="13" fill="#6B6A63">Chaque module ajouté est une pièce mobile de plus — donc un point d'usure, et un consommable à racheter.</text>
</g>
</svg>