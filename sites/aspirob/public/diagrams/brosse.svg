  <text x="60" y="52" font-size="12.5" font-weight="600" fill="#2563EB" letter-spacing="1.3">BROSSE À SOIES</text>
  <text x="60" y="76" font-size="14" fill="#0F172A">Les poils s'enroulent et étranglent le rouleau.</text>
