  <text x="60" y="306" font-size="12.5" font-weight="600" fill="#2563EB" letter-spacing="1.3">BROSSE EN CAOUTCHOUC</text>
  <text x="60" y="330" font-size="14" fill="#0F172A">Les lamelles en hélice ne laissent rien s'enrouler.</text>
